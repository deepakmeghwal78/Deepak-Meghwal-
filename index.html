<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deepak Meghwal | Official</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --orange: #f37021; --blue: #1b2d53; }
        body { font-family: 'Poppins', sans-serif; margin: 0; padding-top: 50px; background: #f9f9f9; }
        
        /* छोटा Top Bar */
        header { background: white; padding: 5px 0; position: fixed; width: 100%; top: 0; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        nav { display: flex; justify-content: space-between; align-items: center; max-width: 1000px; margin: auto; padding: 0 15px; }
        
        .logo-img { height: 40px; width: auto; }
        .brand { font-weight: bold; color: var(--blue); font-size: 1rem; }

        .hero { height: 50vh; background: var(--blue); color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .hero h1 { font-size: 2.2rem; margin: 0; }
        .hero p { color: var(--orange); font-size: 1.1rem; font-weight: bold; margin-top: 5px; }

        .services { padding: 30px 15px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; max-width: 1000px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 10px; border-bottom: 3px solid var(--orange); text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .card i { color: var(--blue); font-size: 1.8rem; margin-bottom: 10px; }
        
        /* WhatsApp Button */
        .wa-btn { background: #25d366; color: white; padding: 10px 20px; border-radius: 50px; text-decoration: none; font-weight: bold; display: inline-block; margin-top: 20px; }
        footer { background: var(--blue); color: white; text-align: center; padding: 15px; font-size: 0.8rem; margin-top: 20px; }
    </style>
</head>
<body>
    <header>
        <nav>
            <img src="logo.png" alt="Logo" class="logo-img">
            <div class="brand">DM SERVICES</div>
        </nav>
    </header>

    <section class="hero">
        <h1>Deepak Meghwal</h1>
        <p>Excel • Typing • Graphics</p>
        <a href="https://wa.me/9190127878" class="wa-btn"><i class="fab fa-whatsapp"></i> Chat on WhatsApp</a>
    </section>

    <section class="services">
        <div class="card"><i class="fas fa-keyboard"></i><h3>Typing</h3></div>
        <div class="card"><i class="fas fa-file-excel"></i><h3>MS Office</h3></div>
        <div class="card"><i class="fas fa-paint-brush"></i><h3>Design</h3></div>
    </section>

    <footer>
        <p>&copy; 2026 Deepak Meghwal | Professional Services</p>
    </footer>
</body>
</html>
